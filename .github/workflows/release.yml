# Builds Miru for Windows and publishes it as a GitHub release.
#
# Release: bump `version` in Cargo.toml, commit, then tag and push:
#   git tag v0.1.2; git push origin master v0.1.2
# The tag must match the version. Installed copies offer the new release as an update.
#
# Dry run: Actions → Release → Run workflow (leave "Publish" off). It builds the installer and
# portable zip and attaches them to the run as an artifact, without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (off = build only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Built into the app: where it looks for updates.
  MIRU_UPDATE_REPO: ${{ github.repository }}
  # libmpv from the community Windows builds (github.com/shinchiro/mpv-winbuild-cmake), pinned
  # by checksum. Upstream keeps about a month of builds; if this one disappears, pick a newer
  # mpv-dev-x86_64-*.7z from its releases and update both lines (GitHub shows the SHA-256).
  MPV_DEV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
  MPV_DEV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (cargo pkgid -p miru) -replace '.*[#@]', ''
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version."
          }

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Fetch libmpv
        run: |
          Invoke-WebRequest $env:MPV_DEV_URL -OutFile mpv-dev.7z
          $hash = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MPV_DEV_SHA256) {
            throw "mpv-dev.7z checksum mismatch (got $hash). Update MPV_DEV_URL and MPV_DEV_SHA256."
          }
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          ./scripts/setup-mpv-windows.ps1 -Dll (Resolve-Path mpv-dev/libmpv-2.dll)

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: ./scripts/package-windows.ps1

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: miru-windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
